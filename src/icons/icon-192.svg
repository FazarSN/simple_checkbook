<!-- 192×192 app icon for Simple Checkbook PWA -->
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="32" fill="#4A90D9"/>
  <!-- Checkbook outline -->
  <rect x="36" y="44" width="120" height="104" rx="8" fill="#ffffff"/>
  <!-- Check line 1 -->
  <line x1="52" y1="68" x2="140" y2="68" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
  <!-- Check line 2 -->
  <line x1="52" y1="88" x2="140" y2="88" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
  <!-- Check line 3 -->
  <line x1="52" y1="108" x2="100" y2="108" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
  <!-- Dashed line -->
  <line x1="52" y1="128" x2="140" y2="128" stroke="#4A90D9" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Dollar sign -->
  <text x="152" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">$</text>
</svg>
